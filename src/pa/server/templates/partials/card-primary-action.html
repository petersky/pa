<span id="card-primary-action-{{ card.id }}"{% if refresh_actions | default(false) %} hx-swap-oob="outerHTML"{% endif %}>
        {% if work_presentation.action.kind == 'open_agent' %}<a class="button" href="{{ work_presentation.action.href }}" aria-label="View running work for {{ card.title }}">View running work</a>
        {% elif work_presentation.action.kind == 'respond' %}<a class="button" href="{{ work_presentation.action.href }}" aria-label="Follow up with running work for {{ card.title }}">Respond</a>
        {% elif work_presentation.can_dispatch %}<button type="button" data-card-dispatch-open data-card-id="{{ card.id }}" data-card-realm="{{ card.realm_id }}">Dispatch</button>{% endif %}
</span>
